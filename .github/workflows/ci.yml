---

name: Tests

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - "connected_k_center/**"
      - "tests/**"
      - "build_extension.py"
      - "pyproject.toml"
      - "poetry.lock"
  pull_request:
    paths:
      - "connected_k_center/**"
      - "tests/**"
      - "build_extension.py"
      - "pyproject.toml"
      - "poetry.lock"
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux testet alle gewünschten Python-Versionen
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: ubuntu-latest
            python-version: "3.15"
          # macOS testet nur Python 3.14
          - os: macos-latest
            python-version: "3.14"
          # Windows testet nur Python 3.14
          - os: windows-latest
            python-version: "3.14"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # --- Boost für Linux ---
      - name: Install Boost (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-all-dev

      # --- Boost für macOS ---
      - name: Install Boost (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install boost libomp
          echo "CPLUS_INCLUDE_PATH=/opt/homebrew/include" >> $GITHUB_ENV
          echo "LIBRARY_PATH=/opt/homebrew/lib" >> $GITHUB_ENV
          echo "LDFLAGS=-L/opt/homebrew/opt/libomp/lib" >> $GITHUB_ENV
          echo "CPPFLAGS=-I/opt/homebrew/opt/libomp/include" >> $GITHUB_ENV


      # --- Boost für Windows ---
      - name: Install Boost (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $boostV = "1.92.0"
          $boostVersionUnder = $boostV -replace '\.', '_'

          $baseUrl = "https://archives.boost.io/release/$boostV/source-nodocs"
          $url = "$baseUrl/boost_$boostVersionUnder.zip"

          Write-Host "Downloading Boost $boostV..."
          Invoke-WebRequest -Uri $url -OutFile "boost.zip"

          Write-Host "Extracting Boost..."
          Expand-Archive -Path "boost.zip" -DestinationPath "C:/"
          Move-Item "C:/boost_$boostVersionUnder" "C:/boost"

          echo "BOOST_ROOT=C:/boost" >> $env:GITHUB_ENV

      - name: Install poetry
        run: pipx install poetry==2.5.1

      - name: Install dependencies (builds the C++ extension)
        run: poetry install --with test

      - name: Run Tests
        run: poetry run python -m unittest discover tests -v
