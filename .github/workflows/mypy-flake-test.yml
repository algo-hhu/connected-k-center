---

name: Linting & Quality Assurance

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - "connected_k_center/**"
      - "tests/**"
      - "build_extension.py"
      - "pyproject.toml"
      - "poetry.lock"
  pull_request:
    paths:
      - "connected_k_center/**"
      - "tests/**"
      - "build_extension.py"
      - "pyproject.toml"
      - "poetry.lock"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Boost
        run: >
          sudo apt-get update &&
          sudo apt-get install -y libboost-all-dev

      - name: Install poetry
        run: pipx install poetry==2.5.1

      - name: Install dependencies (builds the C++ extension)
        run: poetry install --with dev,test

      - name: Run MyPy
        run: >
          poetry run mypy --install-types
          --non-interactive connected_k_center

      - name: Run Flake8
        run: poetry run flake8 connected_k_center/ tests/
